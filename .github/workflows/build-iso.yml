name: Build IBK ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build bootable ISO with Archiso
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out work
          docker run --privileged --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed archiso grub

              cp -a /usr/share/archiso/configs/baseline /workspace/work/profile
              profile=/workspace/work/profile

              # The Archiso baseline already enables BIOS Syslinux and UEFI GRUB.
              # Keep its multiline bootmodes array intact.

              sed -i "s|^iso_name=.*|iso_name=\\\"ibk\\\"|" "$profile/profiledef.sh"
              sed -i "s|^iso_label=.*|iso_label=\\\"IBK_$(date +%Y%m)\\\"|" "$profile/profiledef.sh"
              sed -i "s|^iso_application=.*|iso_application=\\\"Internet Boot Kernel\\\"|" "$profile/profiledef.sh"

              cat /workspace/packages.x86_64 >> "$profile/packages.x86_64"
              install -D -m 0755 /workspace/airootfs/usr/local/bin/ibk "$profile/airootfs/usr/local/bin/ibk"
              install -d "$profile/airootfs/etc/systemd/system/multi-user.target.wants"
              ln -sf /usr/lib/systemd/system/NetworkManager.service "$profile/airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service"

              mkarchiso -v -w /workspace/work/build -o /workspace/out "$profile"
            '

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd out
          sha256sum *.iso > SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: internet-boot-kernel-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
